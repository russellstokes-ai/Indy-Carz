name: Godot engine verification

on:
  push:
    paths:
      - "project.godot"
      - "scripts/**"
      - "tests/godot/**"
      - ".github/workflows/godot-headless.yml"
  pull_request:
    paths:
      - "project.godot"
      - "scripts/**"
      - "tests/godot/**"
      - ".github/workflows/godot-headless.yml"

jobs:
  godot-headless:
    name: Godot 4.4 runtime script and camera checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.4.1"
          use-dotnet: false
      - name: Verify engine
        run: godot --version
      - name: Parse scripts and import project headlessly
        run: godot --headless --editor --path . --quit
      - name: Run verified-original-mechanics and camera smoke tests
        run: godot --headless --path . --script res://tests/godot/test_mechanics.gd
